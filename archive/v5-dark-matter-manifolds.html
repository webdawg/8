<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark Matter Manifolds</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05020a;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: grab;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR, centerX, gapHalf, leftBoundary, rightBoundary;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    centerX = W / 2;
    gapHalf = Math.max(40, W * 0.055);
    leftBoundary = centerX - gapHalf;
    rightBoundary = centerX + gapHalf;
  }
  window.addEventListener('resize', resize);
  resize();

  function noise1D(x, seed) {
    return (
      Math.sin(x * 1.31 + seed) +
      0.5 * Math.sin(x * 2.71 + seed * 1.7) +
      0.25 * Math.sin(x * 5.13 + seed * 0.31)
    ) / 1.75;
  }

  // asymptotically approach `limit` from below, never reach it
  function softClampMax(x, limit, softness) {
    if (x <= limit - softness) return x;
    const t = (x - (limit - softness)) / softness;
    const eased = 1 - Math.exp(-Math.max(t, 0));
    return (limit - softness) + eased * softness;
  }
  // asymptotically approach `limit` from above, never reach it
  function softClampMin(x, limit, softness) {
    if (x >= limit + softness) return x;
    const t = ((limit + softness) - x) / softness;
    const eased = 1 - Math.exp(-Math.max(t, 0));
    return (limit + softness) - eased * softness;
  }

  // ---- 3D basics: a manifold is a flat (u,v) parameter plane, warped along
  // a third axis and rotated through x/y/z before being projected to the screen ----
  function rotatePoint(x, y, z, ax, ay) {
    // rotate around X
    let y1 = y * Math.cos(ax) - z * Math.sin(ax);
    let z1 = y * Math.sin(ax) + z * Math.cos(ax);
    // rotate around Y
    let x2 = x * Math.cos(ay) + z1 * Math.sin(ay);
    let z2 = -x * Math.sin(ay) + z1 * Math.cos(ay);
    return [x2, y1, z2];
  }

  // global slow-down knob: every animated element reads scaled time (see
  // frame()) rather than raw elapsed time, so the whole simulation eases
  const TIME_SCALE = 0.35;

  const FOCAL = 620;
  const CAM_Z = 520;
  function project(x, y, z) {
    const scale = FOCAL / (FOCAL + CAM_Z + z);
    return [x * scale, y * scale, scale];
  }

  function makeManifold(opts) {
    return Object.assign({
      cols: 22,
      rows: 13,
      seed: Math.random() * 100,
      rotSeedX: Math.random() * 10,
      rotSeedY: Math.random() * 10,
    }, opts);
  }

  const halfDim = () => Math.min(W, H);

  const leftManifold = makeManifold({
    side: 'left',
    hueBase: 195,
    hueSpan: 30,
    spinDir: 1
  });
  const rightManifold = makeManifold({
    side: 'right',
    hueBase: 318,
    hueSpan: 35,
    spinDir: -1
  });

  // ---- coupled interaction ----
  // dragging a field kicks it, like a damped spring, riding on top of its
  // idle drift. The two fields are coupled: each frame, some of one's
  // velocity feeds into the other's acceleration — so a push on one keeps
  // showing up in the other over time, not just as a single mirrored nudge.
  // Coupling gain and each field's own spring/damping/noise character are
  // asymmetric, so the linked motion never looks identical between them.
  function initMotion(m, opts) {
    m.velX = 0;
    m.velY = 0;
    m.angX = 0;
    m.angY = 0;
    m.inputFX = 0;
    m.inputFY = 0;
    m.jitterSeed = Math.random() * 100;
    Object.assign(m, opts);
  }
  initMotion(leftManifold, { springK: 0.9, dampC: 1.1, jitterAccel: 0.05, coupleFromOther: 1.1 });
  initMotion(rightManifold, { springK: 0.6, dampC: 0.8, jitterAccel: 0.08, coupleFromOther: 0.65 });

  const IMPULSE_SCALE = 1.4;

  function updateCoupledMotion(t, dt) {
    const pairs = [
      [leftManifold, rightManifold],
      [rightManifold, leftManifold]
    ];
    const accel = pairs.map(([m, other]) => {
      const nx = noise1D(t * 0.7 + m.jitterSeed, m.jitterSeed) * m.jitterAccel;
      const ny = noise1D(t * 0.7 + m.jitterSeed + 31, m.jitterSeed + 31) * m.jitterAccel;
      const ax = -m.springK * m.angX - m.dampC * m.velX + nx + m.inputFX + m.coupleFromOther * other.velX;
      const ay = -m.springK * m.angY - m.dampC * m.velY + ny + m.inputFY + m.coupleFromOther * other.velY;
      return [ax, ay];
    });
    pairs.forEach(([m], idx) => {
      const [ax, ay] = accel[idx];
      m.velX += ax * dt;
      m.velY += ay * dt;
      m.angX += m.velX * dt;
      m.angY += m.velY * dt;
      // transient per-drag force decays rather than holding indefinitely
      m.inputFX *= 0.82;
      m.inputFY *= 0.82;
    });
  }

  let dragManifold = null;
  let lastPointerX = 0;
  let lastPointerY = 0;
  const INPUT_GAIN = 0.28;

  function pointerToManifold(clientX) {
    return clientX < centerX ? leftManifold : rightManifold;
  }

  canvas.addEventListener('pointerdown', (e) => {
    dragManifold = pointerToManifold(e.clientX);
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragManifold) return;
    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    dragManifold.inputFY += dx * INPUT_GAIN;
    dragManifold.inputFX += dy * INPUT_GAIN;
    e.preventDefault();
  });
  function releaseDrag() {
    dragManifold = null;
    canvas.style.cursor = 'grab';
  }
  canvas.addEventListener('pointerup', releaseDrag);
  canvas.addEventListener('pointercancel', releaseDrag);

  // ---- coupling force arrows ----
  // visualizes the only forces exchanged directly between the Left and
  // Right Manifold: each one's angular velocity feeding into the other's
  // acceleration. Arrow direction points from source field to receiving
  // field; length is the current force magnitude; vertical deflection
  // reflects the tilt-axis (angX) component of that same force.
  const ARROW_SLOTS = 5;
  const couplingArrows = Array.from({ length: ARROW_SLOTS }, (_, i) => ({
    yFrac: (i + 0.5) / ARROW_SLOTS,
    phase: Math.random() * Math.PI * 2,
    fromLeft: i % 2 === 0
  }));

  function drawCouplingForces(t) {
    const rightOnLeft = {
      fx: leftManifold.coupleFromOther * rightManifold.velX,
      fy: leftManifold.coupleFromOther * rightManifold.velY
    };
    const leftOnRight = {
      fx: rightManifold.coupleFromOther * leftManifold.velX,
      fy: rightManifold.coupleFromOther * leftManifold.velY
    };

    for (const slot of couplingArrows) {
      const f = slot.fromLeft ? leftOnRight : rightOnLeft;
      const dirSign = slot.fromLeft ? 1 : -1;
      const hue = slot.fromLeft ? leftManifold.hueBase : rightManifold.hueBase;

      const y = slot.yFrac * H + Math.sin(t * 0.6 + slot.phase) * H * 0.015;
      const mag = Math.hypot(f.fx, f.fy);
      const len = Math.min(gapHalf * 1.6, 6 + mag * 40);

      const x1 = centerX - dirSign * len * 0.5;
      const x2 = centerX + dirSign * len * 0.5;
      const yDeflect = f.fx * 18;
      const y2 = y + yDeflect;

      const alpha = 0.3 + Math.min(0.55, mag * 2);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = `hsla(${hue}, 90%, 75%, ${alpha})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      const ang = Math.atan2(y2 - y, x2 - x1);
      const headLen = 5;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(ang - 0.4), y2 - headLen * Math.sin(ang - 0.4));
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(ang + 0.4), y2 - headLen * Math.sin(ang + 0.4));
      ctx.strokeStyle = `hsla(${hue}, 90%, 82%, ${alpha})`;
      ctx.stroke();
    }
  }

  function warpZ(u, v, t, seed) {
    return (
      Math.sin(u * 2.1 + t * 0.5 + seed) * Math.cos(v * 1.7 - t * 0.35 + seed * 0.5) +
      0.4 * Math.sin((u + v) * 3.0 + t * 0.8 + seed * 1.3)
    );
  }

  // ---- the Contour Flow ----
  // energy content living ON the right manifold's surface: lines that trace
  // the gradient field of the manifold's own warp, so their vectors keep
  // changing as they move forward across the curvature. The left manifold's
  // content is the Ribbon Leg Field drawn further down instead. See GLOSSARY.md.
  const STREAMER_COUNT = 42;
  const TRAIL_LEN = 11;
  function spawnStreamer() {
    return { pu: Math.random(), pv: Math.random(), trail: [] };
  }
  rightManifold.streamers = Array.from({ length: STREAMER_COUNT }, spawnStreamer);

  // draws the Left Manifold or the Right Manifold (m.side). See GLOSSARY.md.
  function drawManifold(m, t) {
    const dim = halfDim();
    const planeW = dim * 0.62;
    const planeH = dim * 0.72;
    const amp = dim * 0.09;

    const anchorX = m.side === 'left'
      ? leftBoundary - gapHalf * 2.6
      : rightBoundary + gapHalf * 2.6;
    const anchorY = H / 2;

    // idle autonomous drift, plus the coupled interaction layer on top
    const angleX = 0.35 * Math.sin(t * 0.12 + m.rotSeedX) + 0.15 + m.angX * IMPULSE_SCALE;
    const angleY = m.spinDir * (t * 0.08 + m.rotSeedY) + m.angY * IMPULSE_SCALE;

    const softness = gapHalf * 1.15;
    const pts = [];
    for (let j = 0; j < m.rows; j++) {
      pts.push([]);
      for (let i = 0; i < m.cols; i++) {
        const u = (i / (m.cols - 1) - 0.5) * planeW;
        const v = (j / (m.rows - 1) - 0.5) * planeH;
        const w = warpZ(
          i / (m.cols - 1) * 3.2,
          j / (m.rows - 1) * 3.2,
          t,
          m.seed
        ) * amp;

        const [rx, ry, rz] = rotatePoint(u, v, w, angleX, angleY);
        const [px, py, scale] = project(rx, ry, rz);

        let sx = anchorX + px;
        const sy = anchorY + py;

        sx = m.side === 'left'
          ? softClampMax(sx, leftBoundary, softness)
          : softClampMin(sx, rightBoundary, softness);

        pts[j].push([sx, sy, scale]);
      }
    }

    // horizontal (u) lines
    for (let j = 0; j < m.rows; j++) {
      ctx.beginPath();
      for (let i = 0; i < m.cols; i++) {
        const [sx, sy] = pts[j][i];
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      strokeRow(pts[j], m);
    }
    // vertical (v) lines
    for (let i = 0; i < m.cols; i++) {
      ctx.beginPath();
      for (let j = 0; j < m.rows; j++) {
        const [sx, sy] = pts[j][i];
        if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      const col = pts.map(row => row[i]);
      strokeRow(col, m);
    }

    if (m.side === 'left') {
      drawLegsInside(m, t, { planeW, planeH, anchorX, anchorY, angleX, angleY });
    } else {
      drawEnergyFlow(m, t, { planeW, planeH, amp, anchorX, anchorY, angleX, angleY, softness });
    }
  }

  function drawEnergyFlow(m, t, geom) {
    const { planeW, planeH, amp, anchorX, anchorY, angleX, angleY, softness } = geom;
    const eps = 0.01;
    // dt is a per-frame constant (not derived from t), so it needs its own
    // explicit TIME_SCALE cut, plus an extra reduction on top — this is the
    // object called out as still too fast
    const dt = 0.016 * TIME_SCALE;
    const speed = 0.18;

    for (const s of m.streamers) {
      // flow perpendicular to the warp's gradient — energy following the
      // manifold's own contour lines rather than pooling at its extrema
      const w0 = warpZ(s.pu * 3.2, s.pv * 3.2, t, m.seed);
      const wU = warpZ((s.pu + eps) * 3.2, s.pv * 3.2, t, m.seed);
      const wV = warpZ(s.pu * 3.2, (s.pv + eps) * 3.2, t, m.seed);
      const gradU = (wU - w0) / eps;
      const gradV = (wV - w0) / eps;

      s.pu += -gradV * speed * dt;
      s.pv += gradU * speed * dt;

      s.trail.push([s.pu, s.pv]);
      if (s.trail.length > TRAIL_LEN) s.trail.shift();

      if (s.pu < -0.15 || s.pu > 1.15 || s.pv < -0.15 || s.pv > 1.15) {
        Object.assign(s, spawnStreamer());
        continue;
      }

      const screenTrail = s.trail.map(([pu, pv]) => {
        const u = (pu - 0.5) * planeW;
        const v = (pv - 0.5) * planeH;
        const w = warpZ(pu * 3.2, pv * 3.2, t, m.seed) * amp;
        const [rx, ry, rz] = rotatePoint(u, v, w, angleX, angleY);
        const [px, py, scale] = project(rx, ry, rz);
        let sx = anchorX + px;
        sx = m.side === 'left'
          ? softClampMax(sx, leftBoundary, softness)
          : softClampMin(sx, rightBoundary, softness);
        return [sx, anchorY + py, scale];
      });

      ctx.beginPath();
      screenTrail.forEach(([sx, sy], idx) => {
        if (idx === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      });
      const [, , tailScale] = screenTrail[screenTrail.length - 1];
      const depthLight = Math.min(1, Math.max(0.15, (tailScale - 0.5) * 2.2));
      ctx.strokeStyle = `hsla(${m.hueBase + 20}, 40%, 92%, ${0.35 + depthLight * 0.35})`;
      ctx.lineWidth = 1.1 + depthLight * 0.6;
      ctx.shadowColor = 'hsla(0, 0%, 100%, 0.6)';
      ctx.shadowBlur = 3 * depthLight;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  function strokeRow(points, m) {
    let avgScale = 0;
    for (const p of points) avgScale += p[2];
    avgScale /= points.length;
    const depthLight = Math.min(1, Math.max(0.15, (avgScale - 0.5) * 2.2));
    const hue = m.hueBase + Math.sin(avgScale * 7 + m.seed) * m.hueSpan * 0.3;
    ctx.strokeStyle = `hsla(${hue}, 90%, ${55 + depthLight * 20}%, ${0.18 + depthLight * 0.45})`;
    ctx.lineWidth = 0.8 + depthLight * 0.9;
    ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.5)`;
    ctx.shadowBlur = 4 * depthLight;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // ---- the Afterbang Drips ----
  // Dark Matter's visualization: the thin layer between the fields. See GLOSSARY.md.
  const DRIP_COUNT = 160;
  const drips = [];
  function spawnDrip(atTop) {
    return {
      x: leftBoundary + Math.random() * (rightBoundary - leftBoundary),
      y: atTop ? -Math.random() * H : Math.random() * H,
      vy: 0.25 + Math.random() * 0.9,
      jseed: Math.random() * 1000,
      len: 4 + Math.random() * 10,
      alpha: 0.15 + Math.random() * 0.4,
      spark: 0
    };
  }
  for (let i = 0; i < DRIP_COUNT; i++) drips.push(spawnDrip(false));

  function drawDrips(t) {
    for (const d of drips) {
      const prevY = d.y;
      d.y += d.vy * TIME_SCALE;
      const jitter = noise1D(d.y * 0.02 + t * 0.3, d.jseed) * 6;
      const x = d.x + jitter;

      if (Math.random() < 0.0025) d.spark = 1;
      d.spark *= 0.92;

      ctx.beginPath();
      ctx.moveTo(x, prevY);
      ctx.lineTo(x, d.y + d.len);
      const baseAlpha = d.alpha + d.spark * 0.6;
      ctx.strokeStyle = d.spark > 0.05
        ? `rgba(255, 220, 170, ${Math.min(1, baseAlpha)})`
        : `rgba(150, 110, 190, ${baseAlpha})`;
      ctx.lineWidth = d.spark > 0.05 ? 1.6 : 1;
      ctx.stroke();

      if (d.y - d.len > H) {
        Object.assign(d, spawnDrip(true));
      }
    }
  }

  function drawGapField() {
    const grad = ctx.createLinearGradient(leftBoundary, 0, rightBoundary, 0);
    grad.addColorStop(0, 'rgba(90, 40, 120, 0)');
    grad.addColorStop(0.5, 'rgba(120, 60, 160, 0.05)');
    grad.addColorStop(1, 'rgba(90, 40, 120, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(leftBoundary, 0, rightBoundary - leftBoundary, H);
  }

  // ---- the Tunnel ----
  // a passage across the gap connecting the Left Manifold to the Right
  // Manifold, pinched to a throat at its exact center — where the Dark
  // Matter divider sits, the clear membrane neither field can cross. See
  // GLOSSARY.md.
  const TUNNEL_RINGS = 22;
  const TUNNEL_SEGS = 16;

  function drawTunnel(t) {
    const baseRadius = gapHalf * 0.85;
    const y0 = H / 2;
    const wobbleAmp = gapHalf * 0.05;
    const angleX = 0.06 * Math.sin(t * 0.15);
    const angleY = t * 0.02;

    const rings = [];
    for (let j = 0; j <= TUNNEL_RINGS; j++) {
      const s = j / TUNNEL_RINGS;
      const x = leftBoundary + s * (rightBoundary - leftBoundary);
      // pinch toward the center, where the divider sits
      const pinch = 1 - 0.6 * Math.exp(-(((s - 0.5) * 3.4) ** 2));
      const radius = baseRadius * pinch;
      const yWobble = Math.sin(s * 6 + t * 0.4) * wobbleAmp * (1 - Math.abs(s - 0.5) * 1.6);

      const ring = [];
      for (let k = 0; k <= TUNNEL_SEGS; k++) {
        const phi = (k / TUNNEL_SEGS) * Math.PI * 2;
        const ry = Math.cos(phi) * radius;
        const rz = Math.sin(phi) * radius;
        const [rx2, ry2, rz2] = rotatePoint(0, ry, rz, angleX, angleY);
        const [offX, offY, scale] = project(rx2, ry2, rz2);
        ring.push([x + offX, y0 + yWobble + offY, scale]);
      }
      rings.push({ s, x, ring });
    }

    // rings around the tube (cross-sections)
    for (const { s, ring } of rings) {
      const hue = 195 + s * (318 - 195);
      const nearCenter = Math.exp(-(((s - 0.5) * 6) ** 2));
      ctx.beginPath();
      ring.forEach(([px, py], k) => { if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
      ctx.strokeStyle = `hsla(${hue}, 70%, 70%, ${0.14 + 0.1 * (1 - nearCenter)})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // lines along the tunnel's length
    for (let k = 0; k <= TUNNEL_SEGS; k++) {
      ctx.beginPath();
      rings.forEach(({ ring }, j) => {
        const [px, py] = ring[k];
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.strokeStyle = 'hsla(260, 30%, 80%, 0.07)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // the divider: Dark Matter's membrane, sealing the tunnel's throat
    const centerRing = rings[Math.round(TUNNEL_RINGS / 2)];
    ctx.beginPath();
    centerRing.ring.forEach(([px, py], k) => { if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
    ctx.closePath();
    const dividerGrad = ctx.createRadialGradient(centerX, y0, 0, centerX, y0, baseRadius * 0.5);
    dividerGrad.addColorStop(0, 'rgba(195, 150, 235, 0.4)');
    dividerGrad.addColorStop(1, 'rgba(120, 60, 160, 0)');
    ctx.fillStyle = dividerGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(230, 205, 255, 0.65)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(220, 180, 255, 0.7)';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // ---- Dark Matter chains ----
  // two chains rooted at the divider, one driven by the Left Manifold's
  // current rotation and one by the Right's. Each field's full (angX, angY)
  // rotation state gets collapsed into a single scalar — any shape of motion
  // turned into a linear form — and that scalar becomes pure vertical
  // position, nothing else. Because each chain moves up or down independently
  // off the same signal's sign, the two can land in any combination: both up,
  // both down, or opposite — that sync (or lack of it) is the only way these
  // two fields, which can never truly touch, can be said to touch at all.
  const CHAIN_LINKS = 9;
  const chainL = { x: 0, history: new Array(CHAIN_LINKS).fill(0) };
  const chainR = { x: 0, history: new Array(CHAIN_LINKS).fill(0) };

  function projectToLine(m) {
    return m.angX * 0.6 + m.angY * 0.25;
  }

  function drawDarkMatterChains() {
    const y0 = H / 2;
    const maxReach = H * 0.16;
    chainL.x = centerX - 5;
    chainR.x = centerX + 5;

    [[chainL, leftManifold, 258], [chainR, rightManifold, 285]].forEach(([chain, m, hue]) => {
      const sig = projectToLine(m);
      const tipY = y0 - Math.tanh(sig * 1.4) * maxReach;
      chain.history.push(tipY);
      chain.history.shift();

      const pts = [y0, ...chain.history];
      ctx.beginPath();
      pts.forEach((y, i) => { if (i === 0) ctx.moveTo(chain.x, y); else ctx.lineTo(chain.x, y); });
      ctx.strokeStyle = `hsla(${hue}, 55%, 78%, 0.5)`;
      ctx.lineWidth = 1.4;
      ctx.shadowColor = `hsla(${hue}, 70%, 85%, 0.6)`;
      ctx.shadowBlur = 5;
      ctx.stroke();
      ctx.shadowBlur = 0;

      pts.forEach((y) => {
        ctx.beginPath();
        ctx.arc(chain.x, y, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 65%, 88%, 0.75)`;
        ctx.fill();
      });
    });
  }

  // ---- field object: a tube-manifold shaped like two reclining legs,
  // one bent knee resting higher than the other ----
  function legPath(leg, s) {
    const len1 = leg.length * leg.bendFrac;
    const len2 = leg.length * (1 - leg.bendFrac);
    if (s < leg.bendFrac) {
      const ls = s / leg.bendFrac;
      return {
        x: Math.cos(leg.angle1) * len1 * ls,
        y: leg.yOffset + Math.sin(leg.angle1) * len1 * ls,
        tangent: leg.angle1
      };
    }
    const ls2 = (s - leg.bendFrac) / (1 - leg.bendFrac);
    const kneeX = Math.cos(leg.angle1) * len1;
    const kneeY = leg.yOffset + Math.sin(leg.angle1) * len1;
    return {
      x: kneeX + Math.cos(leg.angle2) * len2 * ls2,
      y: kneeY + Math.sin(leg.angle2) * len2 * ls2,
      tangent: leg.angle2
    };
  }

  // ---- the Ribbon Leg Field ----
  // content living INSIDE the left manifold: two tube-shaped ribbons that
  // share a hip, splayed apart so they cross — sized to the plane itself and
  // carried by its own anchor/rotation, so they read as part of its surface
  // rather than a separate floating object. See GLOSSARY.md.
  const LEG_DEFS = [
    { angle1: Math.PI - 0.4, angle2: Math.PI - 0.85, bendFrac: 0.55, yFrac: 0.06, lengthFrac: 0.42, radiusFrac: 0.03, hue: 250 },
    { angle1: -0.75, angle2: 0.1, bendFrac: 0.5, yFrac: -0.14, lengthFrac: 0.38, radiusFrac: 0.026, hue: 275 }
  ];
  const LEG_TUBE_SEGS = 10;
  const LEG_LENGTH_SEGS = 16;

  // draws the Ribbon Leg Field onto the manifold `m`
  function drawLegsInside(m, t, geom) {
    const { planeW, planeH, anchorX, anchorY, angleX, angleY } = geom;
    const scale = Math.min(planeW, planeH);
    const hipPoints = [];

    for (const legDef of LEG_DEFS) {
      const leg = {
        angle1: legDef.angle1,
        angle2: legDef.angle2,
        bendFrac: legDef.bendFrac,
        yOffset: legDef.yFrac * scale,
        length: legDef.lengthFrac * scale
      };
      const radius = legDef.radiusFrac * scale;

      const ring = [];
      for (let j = 0; j <= LEG_LENGTH_SEGS; j++) {
        const s = j / LEG_LENGTH_SEGS;
        const c = legPath(leg, s);
        const nx = -Math.sin(c.tangent);
        const ny = Math.cos(c.tangent);
        const row = [];
        for (let k = 0; k <= LEG_TUBE_SEGS; k++) {
          const phi = (k / LEG_TUBE_SEGS) * Math.PI * 2;
          const rCos = Math.cos(phi) * radius;
          const rSin = Math.sin(phi) * radius;
          const lx = c.x + nx * rCos;
          const ly = c.y + ny * rCos;
          const lz = rSin;

          const [rx, ry, rz] = rotatePoint(lx, ly, lz, angleX, angleY);
          const [px, py, scaleP] = project(rx, ry, rz);
          row.push([anchorX + px, anchorY + py, scaleP]);
        }
        ring.push(row);
      }

      // rings around the tube (cross-sections)
      for (let j = 0; j <= LEG_LENGTH_SEGS; j++) {
        ctx.beginPath();
        for (let k = 0; k <= LEG_TUBE_SEGS; k++) {
          const [sx, sy] = ring[j][k];
          if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        strokeLeg(ring[j], legDef.hue);
      }
      // lines along the tube length
      for (let k = 0; k <= LEG_TUBE_SEGS; k++) {
        ctx.beginPath();
        for (let j = 0; j <= LEG_LENGTH_SEGS; j++) {
          const [sx, sy] = ring[j][k];
          if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        const col = ring.map(row => row[k]);
        strokeLeg(col, legDef.hue);
      }

      // hip point (s = 0, radius = 0), used to join the two legs below
      const [hrx, hry, hrz] = rotatePoint(0, leg.yOffset, 0, angleX, angleY);
      const [hpx, hpy] = project(hrx, hry, hrz);
      hipPoints.push([anchorX + hpx, anchorY + hpy]);
    }

    // join the two legs together at the hip, then cut a single wall line
    // through the middle of that joint as a barrier between them
    if (hipPoints.length === 2) {
      const [hx1, hy1] = hipPoints[0];
      const [hx2, hy2] = hipPoints[1];

      ctx.beginPath();
      ctx.moveTo(hx1, hy1);
      ctx.lineTo(hx2, hy2);
      ctx.strokeStyle = 'rgba(230, 225, 255, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
      ctx.shadowBlur = 4;
      ctx.stroke();
      ctx.shadowBlur = 0;

      const midX = (hx1 + hx2) / 2;
      const midY = (hy1 + hy2) / 2;
      const dx = hx2 - hx1;
      const dy = hy2 - hy1;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const wallHalf = Math.max(14, scale * 0.07);

      ctx.beginPath();
      ctx.moveTo(midX - nx * wallHalf, midY - ny * wallHalf);
      ctx.lineTo(midX + nx * wallHalf, midY + ny * wallHalf);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  function strokeLeg(points, hue) {
    let avgScale = 0;
    for (const p of points) avgScale += p[2];
    avgScale /= points.length;
    const depthLight = Math.min(1, Math.max(0.1, (avgScale - 0.5) * 2.2));
    ctx.strokeStyle = `hsla(${hue}, 25%, ${75 + depthLight * 15}%, ${0.12 + depthLight * 0.35})`;
    ctx.lineWidth = 0.7 + depthLight * 0.7;
    ctx.shadowColor = `hsla(${hue}, 40%, 90%, 0.4)`;
    ctx.shadowBlur = 3 * depthLight;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  let start = null;
  function frame(ts) {
    if (start === null) start = ts;
    const t = (ts - start) / 1000 * TIME_SCALE;

    ctx.fillStyle = 'rgba(5, 2, 10, 0.18)';
    ctx.fillRect(0, 0, W, H);

    // this system runs at real-time speed regardless of TIME_SCALE — throttling
    // it by the same factor that slows the ambient drift made a full second of
    // dragging barely move the needle, since accel -> velocity -> angle is a
    // double integration and TIME_SCALE was shrinking every step of it
    updateCoupledMotion(t, 0.016);

    drawGapField();
    drawTunnel(t);
    drawDrips(t);
    drawDarkMatterChains();
    drawManifold(leftManifold, t);
    drawManifold(rightManifold, t);
    drawCouplingForces(t);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
